name: Hollard Monthly Pre-population

# On the 1st of each month, appends a predicted row for the month that
# just ended (1 Sep adds Aug, 1 Oct adds Sep) to AIP Stats, SBMAC Stats
# and RAF Claims in the source sheet. Predictions are 6-month averages
# for the raw input columns; derived columns are formulas copied from
# the row above. Any earlier missing months are back-filled too. The
# dashboard sync is triggered straight afterwards so the new rows are
# live the same morning.

on:
  schedule:
    # 03:10 UTC = 05:10 SAST on the 1st — 20 min before the daily sync
    # so the new row appears on the dashboard the same morning.
    - cron: "10 3 1 * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — log planned rows, write nothing"
        required: false
        default: false
        type: boolean
      attempt:
        description: "Internal outage-retry counter — leave at 1"
        required: false
        default: "1"
        type: string

permissions:
  contents: read
  actions:  write

concurrency:
  group:              hollard-sheet-write
  cancel-in-progress: false

jobs:
  prepopulate:
    name: Append predicted month rows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pre-populate monthly rows
        id: prepopulate
        continue-on-error: true
        timeout-minutes: 10
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/prepopulate_month.py

      # Outage resilience — same pattern as sync_dashboard.yml: on failure
      # wait 15 min and re-dispatch (attempt+1); only attempt 4 fails
      # loudly. Safe to re-run: the script only appends months that are
      # still missing.
      - name: Schedule outage retry
        if: ${{ steps.prepopulate.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTEMPT:  ${{ github.event.inputs.attempt || '1' }}
          DRY:      ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY" = "true" ]; then
            echo "::error::Pre-population failed (dry run) — not retrying."
            exit 1
          fi
          if [ "$ATTEMPT" -ge 4 ]; then
            echo "::error::Pre-population failed on attempt $ATTEMPT/4 — giving up."
            exit 1
          fi
          echo "::warning::Pre-population failed (attempt $ATTEMPT/4) — retrying in 15 min."
          sleep 900
          gh workflow run prepopulate_month.yml --ref main -f attempt="$((ATTEMPT + 1))"

      - name: Refresh dashboard
        if: ${{ steps.prepopulate.outcome == 'success' && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync_dashboard.yml --ref main

      - name: Notify on failure
        if: failure()
        run: echo "::error::Hollard monthly pre-population FAILED — check logs."
