name: Hollard Dashboard Sync

# Reads the 6 source tabs of the Hollard AIP/SBMAC sheet, regenerates
# docs/data/summary.json, commits + pushes. The Pages deploy workflow
# fires automatically on the resulting docs/** push.

on:
  schedule:
    # 03:30 UTC daily = 05:30 SAST. Source sheet is updated overnight
    # by Hollard's data team — this gives them headroom before we read.
    - cron: "30 3 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — read sheet only, no commit"
        required: false
        default: false
        type: boolean
      attempt:
        description: "Internal outage-retry counter — leave at 1"
        required: false
        default: "1"
        type: string

permissions:
  contents: write
  actions:  write

concurrency:
  group:              hollard-main-push
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh Hollard dashboard data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export summary data to JSON
        id: export
        continue-on-error: true
        timeout-minutes: 10
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          # Without this the CRM sink reads CORE_DB_URL as unset on every
          # scheduled run, logs "skipping" and writes nothing -- which is
          # exactly what had happened: all four hollard_* tables in core were
          # still empty. Unset secret stays unset, so the sink is still
          # optional and the dashboard refresh is unaffected either way.
          CORE_DB_URL: ${{ secrets.CORE_DB_URL }}
        run: python scripts/export_summary.py

      # Outage resilience: the script already retries transient Google
      # errors for ~2.5 min in-run. If it still failed, wait 15 min and
      # re-dispatch this workflow (attempt+1) instead of failing — only
      # the 4th consecutive failed attempt fails loudly (and emails).
      # Spans ~45+ min of Google downtime before anyone is bothered.
      - name: Schedule outage retry
        if: ${{ steps.export.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTEMPT:  ${{ github.event.inputs.attempt || '1' }}
          DRY:      ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY" = "true" ]; then
            echo "::error::Sheets export failed (dry run) — not retrying."
            exit 1
          fi
          if [ "$ATTEMPT" -ge 4 ]; then
            echo "::error::Sheets export failed on attempt $ATTEMPT/4 — giving up."
            exit 1
          fi
          echo "::warning::Sheets export failed (attempt $ATTEMPT/4) — retrying in 15 min."
          sleep 900
          gh workflow run sync_dashboard.yml --ref main -f attempt="$((ATTEMPT + 1))"

      - name: Commit dashboard data
        id: commit
        if: ${{ steps.export.outcome == 'success' && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/summary.json
          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — nothing to commit."
          else
            git commit -m "chore: refresh Hollard dashboard data"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub deliberately does not fire downstream workflows when the
      # pushing actor is GITHUB_TOKEN (anti-loop guard). The deploy_pages
      # workflow listens on push paths: docs/**, so without this explicit
      # dispatch the freshly-committed summary.json never reaches Pages.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy_pages.yml --ref main

      - name: Notify on failure
        if: failure()
        run: echo "::error::Hollard dashboard sync FAILED — check logs."
